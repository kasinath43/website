version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting Abode Software build"

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t abode-webapp .

  post_build:
    commands:
      - echo "Build completed successfully"
      - echo "Abode Software website is ready"

artifacts:
  files:
    - '**/*'
